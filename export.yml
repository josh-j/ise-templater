---
# Read configuration out of the source appliance into exports/<node>/.
#
#   ./ise export
#   ./ise export -e resources=networkdevicegroup,networkdevice

- name: Export ISE configuration
  hosts: ise_source
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      user: "{{ ise_user }}"
      password: "{{ ise_password }}"
      force_basic_auth: true
      validate_certs: "{{ ise_validate_certs }}"
      timeout: "{{ ise_timeout }}"
      headers:
        Accept: application/json
  vars:
    export_dir: "{{ playbook_dir }}/exports/{{ inventory_hostname }}"

  pre_tasks:
    - name: Load credentials
      ansible.builtin.import_tasks: tasks/load_credentials.yml

    - name: Check credentials
      ansible.builtin.import_tasks: tasks/check_password.yml

  tasks:
    - name: Resolve which resources to export
      ansible.builtin.set_fact:
        selected: >-
          {{ (ise_catalog | ise_enabled_groups(ise_groups_enabled))
             if (resources | default('') | trim) == ''
             else ise_catalog | selectattr('resource', 'in',
                                           resources.split(',') | map('trim') | list) | list }}

    - name: Fail on an unknown resource name
      ansible.builtin.assert:
        that: selected | length > 0
        fail_msg: >-
          No catalog entry matched {{ resources | default('') }}. Known:
          {{ ise_catalog | map(attribute='resource') | join(', ') }}

    - name: Create the export directory
      ansible.builtin.file:
        path: "{{ export_dir }}"
        state: directory
        mode: "0700"

    - name: Export each resource
      ansible.builtin.include_tasks: tasks/export_resource.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: res
        label: "{{ res.resource }}"
