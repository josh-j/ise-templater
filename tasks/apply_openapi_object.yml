---
# A flat OpenAPI resource. There is no get-by-name here, so the collection is
# read and matched in memory.

- name: Note the object name
  ansible.builtin.set_fact:
    obj_name: "{{ obj | ise_name_of(res.name_key | default('name')) }}"

- name: Read {{ res.resource }} on the target
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}"
    status_code: "{{ [200, 400, 404, 500] if res.optional | default(false) else [200] }}"
  register: target_coll
  check_mode: false

- name: Resolve the existing id, if any
  ansible.builtin.set_fact:
    existing_id: >-
      {{ (target_coll.json.response | default([])
          | ise_find_id(res.name_key | default('name'), obj_name))
         if target_coll.status == 200 else '' }}

- name: Report the intended change
  ansible.builtin.debug:
    msg: "{{ 'CREATE' if existing_id == '' else 'UPDATE' }} {{ res.resource }} {{ obj_name }}"
  when: ise_dry_run | bool

- name: Create {{ obj_name }}
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}"
    method: POST
    body_format: json
    body: "{{ obj }}"
    status_code: [200, 201]
  when:
    - existing_id == ''
    - not (ise_dry_run | bool)

# The id goes in the body as well as the URL, exactly as ERS wants it. Omit it
# and ISE answers 500 with "Bad Request. Please see logs for more details."
- name: Update {{ obj_name }}
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}/{{ existing_id }}"
    method: PUT
    body_format: json
    body: "{{ obj | combine({'id': existing_id}) }}"
    status_code: [200]
  when:
    - existing_id != ''
    - not (ise_dry_run | bool)
