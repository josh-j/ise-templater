---
# Dispatch one rendered template at whichever API owns it.

- name: Render {{ tmpl | basename }}
  ansible.builtin.set_fact:
    obj: "{{ lookup('template', tmpl) | from_json }}"

- name: Apply via ERS
  ansible.builtin.include_tasks: tasks/apply_ers_object.yml
  when: (res.api | default('ers')) == 'ers'

- name: Apply via OpenAPI
  ansible.builtin.include_tasks: tasks/apply_openapi_object.yml
  when:
    - (res.api | default('ers')) == 'openapi'
    - res.children is not defined

- name: Apply a policy set and its rules
  ansible.builtin.include_tasks: tasks/apply_policyset.yml
  when: res.children is defined
