---
# Every object of one resource that the templates name, deleted.

- name: "{{ res.resource }}: count the collection"
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ res.resource }}?size=1"
  register: coll_count
  check_mode: false
  when: (res.lookup | default('name')) == 'collection'

- name: "{{ res.resource }}: page the collection"
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ res.resource }}?size={{ ise_page_size }}&page={{ page }}"
  register: coll_pages
  check_mode: false
  loop: >-
    {{ range(1, ((coll_count.json.SearchResult.total | int) + ise_page_size - 1)
                 // ise_page_size + 1) | list
       if (res.lookup | default('name')) == 'collection' else [] }}
  loop_control:
    loop_var: page
    label: "page {{ page }}"

- name: "{{ res.resource }}: index the collection by name"
  ansible.builtin.set_fact:
    ers_name_map: >-
      {{ dict(coll_pages.results | map(attribute='json.SearchResult.resources') | flatten
              | map(attribute=res.name_key | default('name')) | zip(
              coll_pages.results | map(attribute='json.SearchResult.resources') | flatten
              | map(attribute='id')))
         if (res.lookup | default('name')) == 'collection' else {} }}

- name: "{{ res.resource }}: read the collection"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}"
    # Same tolerance export has: sgt/reservation is 3.5-only and ipsec 404s
    # until a node exists. Neither is a reason to abort a walk.
    status_code: "{{ [200, 400, 404, 500] if res.optional | default(false) else [200] }}"
  register: target_coll
  check_mode: false
  when: (res.api | default('ers')) == 'openapi'

- name: "{{ res.resource }}: find site templates"
  ansible.builtin.find:
    paths: "{{ site_template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: found_site
  when: ise_sites | default([]) | length > 0

- name: "{{ res.resource }}: destroy each site object"
  ansible.builtin.include_tasks: tasks/destroy_site_object.yml
  loop: >-
    {{ (found_site.files | default([]) | map(attribute='path') | sort | list)
       | product(ise_sites | default([])) | list }}
  loop_control:
    loop_var: pair
    label: "{{ pair.0 | basename }} @ {{ pair.1.name }}"

- name: "{{ res.resource }}: find exported templates"
  ansible.builtin.find:
    paths: "{{ template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: found
  when: not (ise_site_only | bool)

- name: "{{ res.resource }}: destroy each exported object"
  ansible.builtin.include_tasks: tasks/destroy_object.yml
  loop: >-
    {{ [] if ise_site_only | bool
       else found.files | map(attribute='path') | sort | list }}
  loop_control:
    loop_var: tmpl
    label: "{{ tmpl | basename }}"
