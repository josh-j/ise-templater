---
# Render one template only far enough to learn its name, then delete whatever
# holds that name on the target. Deleting a policy set takes its rules with
# it, so rules are never deleted individually.

- name: Render {{ tmpl | basename }}
  ansible.builtin.set_fact:
    obj: "{{ lookup('template', tmpl) | from_json }}"

- name: Note the object name
  ansible.builtin.set_fact:
    obj_name: >-
      {{ obj.name if res.children is defined
         else ((obj[res.root] | ise_name_of(res.name_key | default('name'))) if res.root is defined
               else (obj | ise_name_of(res.name_key | default('name')))) }}

- name: Look up {{ obj_name }} by name
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ res.resource }}/name/{{ obj_name | urlencode }}"
    status_code: [200, 404]
  register: by_name
  check_mode: false
  when:
    - (res.api | default('ers')) == 'ers'
    - (res.lookup | default('name')) == 'name'

- name: Resolve the id, if it is there at all
  ansible.builtin.set_fact:
    doomed_id: >-
      {{ ((target_coll.json.response | default([]) | ise_find_id(res.name_key | default('name'), obj_name))
          if target_coll.status | default(0) == 200 else '')
         if (res.api | default('ers')) == 'openapi'
         else ((by_name.json[res.root].id if by_name.status == 200 else '')
               if (res.lookup | default('name')) == 'name'
               else (ers_name_map[obj_name] | default('', true))) }}

- name: Report the intended delete
  ansible.builtin.debug:
    msg: >-
      {{ 'DELETE' if doomed_id != '' else 'absent  ' }}
      {{ res.resource }} {{ obj_name }}
  when: ise_dry_run | bool

- name: Delete {{ obj_name }}
  ansible.builtin.uri:
    url: >-
      {{ (ise_api_url ~ res.path ~ '/' ~ doomed_id)
         if (res.api | default('ers')) == 'openapi'
         else (ise_ers_url ~ '/config/' ~ res.resource ~ '/' ~ doomed_id) }}
    method: DELETE
    status_code: [200, 204]
  when:
    - doomed_id != ''
    - not (ise_dry_run | bool)
