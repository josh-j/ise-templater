---
# credentials.yml is optional and gitignored. It is loaded here rather than
# through `vars_files` because vars_files is fatal on a missing file, and a
# checkout that keeps its password in ISE_PASSWORD should not have to create an
# empty file to satisfy it.
#
# include_vars outranks group_vars/all.yml, so anything set in the file wins
# over the env/sops resolution there -- and `-e` still outranks both.
- name: Load credentials.yml if it is present
  ansible.builtin.include_vars:
    file: "{{ ise_credentials_file }}"
  when: ise_credentials_file is exists
  tags: always
