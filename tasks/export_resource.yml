---
# Dispatch on which API the resource lives behind. The two are different
# enough -- port, envelope, pagination, whether the listing carries the whole
# object -- that one set of tasks covering both would be worse than two.

- name: "{{ res.resource }}: export via ERS"
  ansible.builtin.include_tasks: tasks/export_ers.yml
  when: (res.api | default('ers')) == 'ers'

- name: "{{ res.resource }}: export via OpenAPI"
  ansible.builtin.include_tasks: tasks/export_openapi.yml
  when: (res.api | default('ers')) == 'openapi'
