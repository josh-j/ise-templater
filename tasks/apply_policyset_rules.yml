---
# One rule collection (authentication, authorization or exception) of one
# policy set.

- name: "{{ obj_name }}/{{ child }}: read the target's rules"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}/{{ policyset_id }}/{{ child }}"
    status_code: [200, 404]
  register: target_rules
  check_mode: false

- name: "{{ obj_name }}/{{ child }}: index the target's rules by name"
  ansible.builtin.set_fact:
    target_rule_ids: >-
      {{ dict((target_rules.json.response | default([], true))
              | map(attribute='rule.name') | zip(
              (target_rules.json.response | default([], true))
              | map(attribute='rule.id'))) }}

# In rank order, so a fresh policy set ends up with its rules in the order the
# source had them. ISE appends a created rule at the rank it is given.
- name: "{{ obj_name }}/{{ child }}: apply each rule"
  ansible.builtin.include_tasks: tasks/apply_policyset_rule.yml
  loop: "{{ (doc[child] | default([], true)) | sort(attribute='rule.rank') }}"
  loop_control:
    loop_var: rule_doc
    label: "{{ rule_doc.rule.name }}"
