---
# Export one OpenAPI resource. Unlike ERS the listing already carries whole
# objects, so there is no per-object detail fetch and no pagination to walk.

# `optional` covers endpoints that legitimately are not there: sgt/reservation
# exists on 3.5 and 404s on 3.3, and ipsec answers "IPSec nodes do not exist"
# until one is configured. Neither is an export failure.
# OpenAPI collections page with a silent default of 100. Ask for `size` and
# you get it -- /trustsec/sgacl/nbarapp holds 780 and returned exactly 100
# until this was noticed. Nothing in the response says it was truncated:
# no total, no nextPage, just a short-looking list.
- name: "{{ res.resource }}: GET the collection"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}{{ '' if res.singleton | default(false) else '?size=' ~ ise_api_page_size }}"
    status_code: "{{ [200, 400, 404, 500] if res.optional | default(false) else [200] }}"
  register: api_coll
  check_mode: false

# Only pages past the first if the first came back full. A page beyond the end
# returns an empty list, so trailing pages cost nothing when there is no more.
- name: "{{ res.resource }}: page on if that filled"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}?size={{ ise_api_page_size }}&page={{ page }}"
    status_code: [200]
  register: api_more
  check_mode: false
  loop: >-
    {{ range(2, ise_api_max_pages | int + 1) | list
       if (api_coll.status == 200
           and not (res.singleton | default(false))
           and (api_coll.json.response | default([]) | length) == (ise_api_page_size | int))
       else [] }}
  loop_control:
    loop_var: page
    label: "page {{ page }}"

- name: "{{ res.resource }}: unwrap the response"
  ansible.builtin.set_fact:
    # Three shapes to reconcile. Most collections wrap in `response`; a few --
    # endpoint-custom-attribute among them -- return a bare JSON array with no
    # envelope at all; a singleton returns one object where a collection
    # returns a list, so it is named and boxed into a list of one.
    api_objects: >-
      {{ []
         if api_coll.status != 200
         else ([api_coll.json.response | combine({'name': res.resource})]
               if res.singleton | default(false)
               else ((api_coll.json
                      if api_coll.json is sequence and api_coll.json is not mapping
                      else api_coll.json.response)
                     + (api_more.results | default([])
                        | map(attribute='json.response') | flatten | list))) }}

- name: "{{ res.resource }}: warn if it is still truncated"
  ansible.builtin.debug:
    msg: >-
      {{ res.resource }}: filled every one of {{ ise_api_max_pages }} pages at
      {{ ise_api_page_size }} objects each. Raise ise_api_max_pages -- the
      export is short and nothing in the response would say so.
  when:
    - api_more.results is defined
    - api_more.results | length > 0
    - (api_more.results | last).json.response | default([]) | length == (ise_api_page_size | int)

- name: "{{ res.resource }}: write the export"
  ansible.builtin.copy:
    content: "{{ api_objects | to_nice_json }}"
    dest: "{{ export_dir }}/{{ res.resource }}.json"
    mode: "0600"
  when: res.children is not defined

# Policy sets are the only hierarchical case: the rules that make a policy set
# mean anything are separate collections hanging off its id. Each parent and
# its rule lists are kept in one document, because that is the unit a person
# reasons about and the unit that has to be applied together.
- name: "{{ res.resource }}: reset the accumulator"
  ansible.builtin.set_fact:
    aggregate_docs: []
  when: res.children is defined

- name: "{{ res.resource }}: fetch child rules per policy set"
  ansible.builtin.include_tasks: tasks/export_openapi_children.yml
  loop: "{{ api_objects }}"
  loop_control:
    loop_var: parent
    label: "{{ parent.name }}"
  when: res.children is defined

- name: "{{ res.resource }}: write the aggregate export"
  ansible.builtin.copy:
    content: "{{ aggregate_docs | sort(attribute='name') | list | to_nice_json }}"
    dest: "{{ export_dir }}/{{ res.resource }}.json"
    mode: "0600"
  when: res.children is defined
