---
# Put one (template, site) pair in scope and hand it to the normal delete path.

- name: Scope {{ pair.0 | basename }} to {{ pair.1.name }}
  ansible.builtin.set_fact:
    tmpl: "{{ pair.0 }}"
    site: "{{ pair.1 }}"

- name: Destroy {{ pair.0 | basename }} for {{ pair.1.name }}
  ansible.builtin.include_tasks: tasks/destroy_object.yml
