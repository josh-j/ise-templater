---
# Every template for one resource, in filename order. That ordering matters
# for network device groups: "Device Type#All Device Types" sorts ahead of
# "Device Type#All Device Types#Switch", so parents land before children.

# Some ERS resources have no GET-by-name, and `?filter=name.EQ.` cannot stand
# in for it -- guesttype and sponsorgroup accept the filter, ignore it, and
# return the whole collection, which would have matched the first object's id
# to every template. So for those the collection is read once here and matched
# in memory, rather than trusting a per-object query.
- name: "{{ res.resource }}: count the collection"
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ res.resource }}?size=1"
  register: coll_count
  check_mode: false
  when: (res.lookup | default('name')) == 'collection' or res.parent_ref is defined

- name: "{{ res.resource }}: page the collection"
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ res.resource }}?size={{ ise_page_size }}&page={{ page }}"
  register: coll_pages
  check_mode: false
  loop: >-
    {{ range(1, ((coll_count.json.SearchResult.total | int) + ise_page_size - 1)
                 // ise_page_size + 1) | list
       if ((res.lookup | default('name')) == 'collection' or res.parent_ref is defined)
       else [] }}
  loop_control:
    loop_var: page
    label: "page {{ page }}"

- name: "{{ res.resource }}: index the collection by name"
  ansible.builtin.set_fact:
    ers_name_map: >-
      {{ dict(coll_pages.results | map(attribute='json.SearchResult.resources') | flatten
              | map(attribute=res.name_key | default('name')) | zip(
              coll_pages.results | map(attribute='json.SearchResult.resources') | flatten
              | map(attribute='id')))
         if ((res.lookup | default('name')) == 'collection' or res.parent_ref is defined)
         else {} }}

# Policy and rule conditions are stored by reference, and the reference carries
# an id that only means something on the appliance it came from. This is the
# target's own name-to-id map, used to repoint them.
#
# Read here rather than once at the start of the play: a site template can
# create the very conditions its policy set then references, and a map built
# before that run would be missing them. ISE catches it -- "condition.children
# [1].id, must not be null" -- but only after the run is already underway.
- name: "{{ res.resource }}: read the target's condition library"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}/api/v1/policy/network-access/condition"
  register: target_conditions
  check_mode: false
  when: res.children is defined

- name: "{{ res.resource }}: index the condition library by name"
  ansible.builtin.set_fact:
    condition_map: >-
      {{ dict(target_conditions.json.response | map(attribute='name')
              | zip(target_conditions.json.response | map(attribute='id'))) }}
  when: res.children is defined

# name -> id for the OTHER resources this one points at, read from the target
# so the ids belong to the appliance being written to.
- name: "{{ res.resource }}: start with no reference maps"
  ansible.builtin.set_fact:
    ref_maps: {}

- name: "{{ res.resource }}: read each referenced resource on the target"
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/{{ item }}?size={{ ise_page_size }}"
  register: ref_colls
  check_mode: false
  loop: "{{ (res.refs | default([])) | map(attribute='resource') | unique | list }}"
  loop_control:
    label: "{{ item }}"

- name: "{{ res.resource }}: index them by name"
  ansible.builtin.set_fact:
    ref_maps: >-
      {{ ref_maps | combine({item.item: dict(
           item.json.SearchResult.resources | map(attribute='name')
           | zip(item.json.SearchResult.resources | map(attribute='id'))) }) }}
  loop: "{{ ref_colls.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: ref_colls.results is defined

- name: "{{ res.resource }}: find templates"
  ansible.builtin.find:
    paths: "{{ template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: found

- name: "{{ res.resource }}: apply each object"
  ansible.builtin.include_tasks: tasks/apply_object.yml
  loop: >-
    {{ [] if ise_site_only | bool
       else found.files | map(attribute='path') | sort | list }}
  loop_control:
    loop_var: tmpl
    label: "{{ tmpl | basename }}"

# One template, N objects. The object's identity comes from the rendered name,
# not the filename, so a template that names itself after `site` produces a
# distinct object per site with no extra machinery.
- name: "{{ res.resource }}: find site templates"
  ansible.builtin.find:
    paths: "{{ site_template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: found_site
  when: ise_sites | default([]) | length > 0

- name: "{{ res.resource }}: apply each site template, once per site"
  ansible.builtin.include_tasks: tasks/apply_site_object.yml
  loop: >-
    {{ (found_site.files | default([]) | map(attribute='path') | sort | list)
       | product(ise_sites | default([])) | list }}
  loop_control:
    loop_var: pair
    label: "{{ pair.0 | basename }} @ {{ pair.1.name }}"
