---
# Check every object this policy set points at, before writing anything.
#
# Without this, a missing authorization profile surfaces as a 400 partway
# through -- after the set exists and some of its rules are in -- and you are
# left reconciling a half-applied policy by hand. Here it is a list.

- name: "{{ obj_name }}: collect what it references"
  ansible.builtin.set_fact:
    policy_refs: "{{ doc | ise_policy_refs }}"

# The identity-stores endpoint is the authoritative list of everything an
# `identitySourceName` may legally name -- internal stores, AD join points and
# sequences together. This used to be declared uncheckable on the grounds that
# no single endpoint answered for all three. It does.
- name: "{{ obj_name }}: read the target's identity stores"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}/api/v1/policy/network-access/identity-stores"
  register: target_id_stores
  check_mode: false
  when: policy_refs | selectattr('kind', 'equalto', 'idstoresequence') | list | length > 0

- name: "{{ obj_name }}: resolve each reference on the target"
  ansible.builtin.uri:
    url: >-
      {{ (ise_api_url ~ '/api/v1/policy/network-access/condition/condition-by-name/' ~ (ref.name | urlencode))
         if ref.kind == 'condition'
         else (ise_ers_url ~ '/config/' ~ ref.kind ~ '/name/' ~ (ref.name | urlencode)) }}
    status_code: [200, 404]
  register: ref_checks
  check_mode: false
  loop: "{{ policy_refs | rejectattr('kind', 'equalto', 'idstoresequence') | list }}"
  loop_control:
    loop_var: ref
    label: "{{ ref.kind }}/{{ ref.name }}"

- name: "{{ obj_name }}: check identity sources against that list"
  ansible.builtin.set_fact:
    id_store_misses: >-
      {{ policy_refs | selectattr('kind', 'equalto', 'idstoresequence')
         | rejectattr('name', 'in',
             (target_id_stores.json | default([], true)) | map(attribute='name') | list)
         | list }}

- name: "{{ obj_name }}: sort the misses"
  ansible.builtin.set_fact:
    refs_missing: >-
      {{ (ref_checks.results | selectattr('status', 'equalto', 404)
          | map(attribute='ref') | rejectattr('kind', 'in', preflight_advisory) | list)
         + (id_store_misses | default([])) }}
    refs_advisory: >-
      {{ ref_checks.results | selectattr('status', 'equalto', 404)
         | map(attribute='ref') | selectattr('kind', 'in', preflight_advisory) | list }}

- name: "{{ obj_name }}: note the inconclusive ones"
  ansible.builtin.debug:
    msg: >-
      {{ obj_name }}: could not confirm
      {{ refs_advisory | map(attribute='name') | join(', ') }}.
  when: refs_advisory | length > 0

# A dry run creates nothing, so anything earlier in this same run would have
# supplied is legitimately still absent. Report it, do not fail on it -- the
# list is the answer to "what does this need", which is what a dry run is for.
- name: "{{ obj_name }}: report unresolved references"
  ansible.builtin.debug:
    msg: >-
      {{ obj_name }} needs {{ refs_missing | map(attribute='name') | join(', ') }}
      -- absent now; earlier CREATEs in this run would supply them.
  when:
    - ise_dry_run | bool
    - refs_missing | length > 0

- name: "{{ obj_name }}: fail on anything missing"
  ansible.builtin.assert:
    that: refs_missing | length == 0
    fail_msg: >-
      {{ obj_name }} references objects the target does not have:
      {{ refs_missing | map('to_json') | join('; ') }}.
      Apply the resources that own them first, or add them as site templates.
    success_msg: >-
      {{ obj_name }}: {{ policy_refs | length }} references,
      {{ policy_refs | length - refs_advisory | length }} confirmed present,
      {{ refs_advisory | length }} inconclusive
  when: not (ise_dry_run | bool)
