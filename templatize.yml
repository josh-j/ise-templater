---
# Turn exports/<node>/*.json into templates/<resource>/<name>.json.j2 --
# one file per object, server-owned fields removed, site-specific literals
# rewritten as Jinja references.
#
#   ./ise templatize
#   ./ise templatize -e resources=networkdevice

- name: Templatize the export
  hosts: ise_source
  gather_facts: false
  vars:
    export_dir: "{{ playbook_dir }}/exports/{{ inventory_hostname }}"
    template_dir: "{{ playbook_dir }}/templates"

  pre_tasks:
    # Loaded but not checked: this playbook works off exports/ and only reaches
    # the appliance for the references a listing omits, so an absent password
    # must not stop a run that never needs one.
    - name: Load credentials
      ansible.builtin.import_tasks: tasks/load_credentials.yml

  tasks:
    # `mode: config` resources export but are never templated -- see the
    # catalog for why each one is that way.
    - name: Resolve which resources to templatize
      ansible.builtin.set_fact:
        selected: >-
          {{ ((ise_catalog | ise_enabled_groups(ise_groups_enabled))
              if (resources | default('') | trim) == ''
              else ise_catalog | selectattr('resource', 'in',
                                            resources.split(',') | map('trim') | list) | list)
             | ise_exclude_config }}

    - name: Fail on an unknown resource name
      ansible.builtin.assert:
        that: selected | length > 0
        fail_msg: >-
          No catalog entry matched {{ resources | default('') }}. Known:
          {{ ise_catalog | map(attribute='resource') | join(', ') }}

    - name: Templatize each resource
      ansible.builtin.include_tasks: tasks/templatize_resource.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: res
        label: "{{ res.resource }}"
