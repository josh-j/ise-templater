[defaults]
# group_vars/ and host_vars/ are read from beside the inventory, so they live
# in inventory/ too. Moving one without the other loads no variables at all --
# and it does that silently, with an empty catalog and no error.
inventory           = inventory/hosts.yml
result_format       = yaml

# Ansible finds roles/ and filter_plugins/ next to the playbook it is running.
# The playbooks are in playbooks/ and these are not, so name them here or the
# first `roles:` line fails with "the role was not found". Relative paths are
# resolved against the working directory, which is the repository root -- the
# same assumption `inventory` above already makes, and what `./ise` cd's to.
roles_path          = ./roles
filter_plugins      = ./filter_plugins

# A full run skips hundreds of tasks -- every resource that is not in this
# run, every branch not taken. Hiding them is the difference between output
# you can read and a wall of "skipping:".
display_skipped_hosts = False

retry_files_enabled = False
localhost_warning   = False
deprecation_warnings = False

# How long the run took, printed at the end. Exports are slow enough to care.
callbacks_enabled = ansible.builtin.timer

[inventory]
# A malformed inventory.yml should say so, not quietly leave you with no hosts.
unparsed_is_failed = True
