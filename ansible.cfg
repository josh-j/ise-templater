[defaults]
inventory           = inventory.yml
result_format       = yaml

# A full run skips hundreds of tasks -- every resource that is not in this
# run, every branch not taken. Hiding them is the difference between output
# you can read and a wall of "skipping:".
display_skipped_hosts = False

retry_files_enabled = False
localhost_warning   = False
deprecation_warnings = False

# How long the run took, printed at the end. Exports are slow enough to care.
callbacks_enabled = ansible.builtin.timer

[inventory]
# A malformed inventory.yml should say so, not quietly leave you with no hosts.
unparsed_is_failed = True
