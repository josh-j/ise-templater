---
# Remove what the site templates created, in reverse dependency order.
#
#   ./ise destroy                                                  # show only
#   ./ise destroy --force
#
# This one is dry by default, the opposite of apply.yml. You have to ask for
# the writes.
#
# Order is `ise_catalog` reversed, and that is the whole point: ISE refuses to
# drop an object something else still points at. A dACL cannot go while an
# authorization profile names it, and that profile cannot go while a policy
# set rule names it. Deleting in apply order fails on the first dependency;
# deleting in reverse works because the referrer is always gone first.
#
# By default it only touches objects the SITE templates name -- the things
# this tool created. `templates/` is an export of what the appliance already
# had, much of it Cisco built-ins, and pointing a delete at it would strip the
# deployment. That needs an explicit second flag and still refuses without it.

- name: Destroy site-template objects
  hosts: ise_target
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      user: "{{ ise_user }}"
      password: "{{ ise_password }}"
      force_basic_auth: true
      validate_certs: "{{ ise_validate_certs }}"
      timeout: "{{ ise_timeout }}"
      headers:
        Accept: application/json
        # ERS answers 415 to a DELETE with no Content-Type, which reads like a
        # malformed body on a request that has no body at all.
        Content-Type: application/json
  vars:
    template_dir: "{{ playbook_dir }}/templates"
    site_template_dir: "{{ playbook_dir }}/site-templates"
    ise_dry_run: true
    ise_site_only: true
    ise_confirm_destroy_exported: false

  pre_tasks:
    - name: Load credentials
      ansible.builtin.import_tasks: tasks/load_credentials.yml

    - name: Check credentials
      ansible.builtin.import_tasks: tasks/check_password.yml

  tasks:
    - name: Resolve which resources to walk, in reverse
      ansible.builtin.set_fact:
        selected: >-
          {{ (((ise_catalog | ise_enabled_groups(ise_groups_enabled))
               if (resources | default('') | trim) == ''
               else ise_catalog | selectattr('resource', 'in',
                                             resources.split(',') | map('trim') | list) | list)
              | ise_exclude_config) | reverse | list }}

    - name: Refuse to delete exported objects without an explicit say-so
      ansible.builtin.assert:
        that: ise_site_only | bool or ise_confirm_destroy_exported | bool
        fail_msg: >-
          ise_site_only=false would delete every object named by templates/,
          which is an export of the appliance's own configuration including
          Cisco built-ins. Pass -e ise_confirm_destroy_exported=true as well
          if that is genuinely what you want.

    - name: Announce the target
      ansible.builtin.debug:
        msg: >-
          {{ 'DRY RUN -- ' if ise_dry_run | bool else 'DELETING from ' }}{{
          inventory_hostname }} ({{ ansible_host }}),
          {{ 'site templates only' if ise_site_only | bool else 'site AND exported templates' }},
          reverse order: {{ selected | map(attribute='resource') | join(' <- ') }}

    - name: Destroy each resource in reverse catalog order
      ansible.builtin.include_tasks: tasks/destroy_resource.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: res
        label: "{{ res.resource }}"
