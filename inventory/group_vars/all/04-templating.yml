---
# What playbooks/templatize.yml removes, what it rewrites, and what
# playbooks/apply.yml puts back.

# --- what gets removed -----------------------------------------------------
# Server-owned fields. They describe where an object lives on one appliance,
# not what the object is, and the target mints its own. Stripped recursively,
# because policy set rules nest ids several levels down.
ise_strip_keys:
  - id
  - link

# --- what gets rewritten ---------------------------------------------------
# Values that differ between deployments. Each entry rewrites a literal in the
# exported JSON into a Jinja reference, which playbooks/apply.yml resolves
# from the site values below. The three here are the three distinct RADIUS
# shared secrets the source lab uses.
#
#   regexp   a regular expression, so escape any dot you mean literally
#   replace  what to put there. `!unsafe` stops Ansible expanding it now --
#            the braces have to survive into the .j2 file
ise_tokens:
  - regexp: 'ise3simprobe'
    replace: !unsafe '{{ site_radius_secret_sim }}'
  - regexp: 'labradius'
    replace: !unsafe '{{ site_radius_secret_lab }}'
  - regexp: 'cisco123'
    replace: !unsafe '{{ site_radius_secret_cml }}'

# --- what they resolve to --------------------------------------------------
# Change these to push your own shared secrets instead of the exported ones,
# here, in 99-credentials.yml, or with -e site_radius_secret_lab=... for one
# run.
#
# The defaults reproduce the source appliance exactly, so an untouched round
# trip is a no-op rather than a surprise.
site_radius_secret_sim: ise3simprobe
site_radius_secret_lab: labradius
site_radius_secret_cml: cisco123
