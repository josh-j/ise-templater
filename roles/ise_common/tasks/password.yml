---
# An empty password does not stop a run -- it produces a 401 on the first call,
# which reads like a locked account rather than an unset variable. Fail here
# instead, with the fix in the message.
#
# Not imported by playbooks/templatize.yml: that one works off exports/ and
# only touches the appliance for references the listings omit, so requiring a
# password up front would break templatizing offline.
- name: Check that an ISE password is available
  ansible.builtin.assert:
    that: ise_password | length > 0
    quiet: true
    fail_msg: >-
      No ISE password. Either run ./ise setup, which puts a
      99-credentials.yml in inventory/group_vars/all/ for you to fill in, or
      set ISE_PASSWORD in the environment. There is also
      -e ise_password_sops=true, which reads it from {{ sops_file }}.
