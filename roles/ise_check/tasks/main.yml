---
# One GET against each API, on every host it is run against.
#
# Both calls are `failed_when: false` so one unreachable node still lets the
# others report. The assert at the end is what fails the run.

- name: Call ERS
  ansible.builtin.uri:
    url: "{{ ise_ers_url }}/config/networkdevicegroup?size=1"
    status_code: [200]
  register: ise_check_ers
  failed_when: false

- name: Call OpenAPI
  ansible.builtin.uri:
    url: "{{ ise_api_url }}/api/v1/policy/network-access/policy-set"
    status_code: [200]
  register: ise_check_openapi
  failed_when: false

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_host }}) as {{ ise_user }}:
      ERS {{ ise_check_verdicts.get(ise_check_ers.status | default(0), 'HTTP '
      ~ ise_check_ers.status | default('?')) }},
      OpenAPI {{ ise_check_verdicts.get(ise_check_openapi.status | default(0),
      'HTTP ' ~ ise_check_openapi.status | default('?')) }}

# Both APIs have to work: the catalog is split across them, so a node that
# answers on one is still only half usable.
- name: Fail if either API refused
  ansible.builtin.assert:
    that:
      - ise_check_ers.status | default(0) == 200
      - ise_check_openapi.status | default(0) == 200
    quiet: true
    fail_msg: >-
      {{ inventory_hostname }} is not usable -- see the line above for
      which API said what. Credentials come from credentials.yml or
      ISE_PASSWORD; the ERS API and the Open API are enabled separately,
      under Administration > System > Settings > API Settings.
