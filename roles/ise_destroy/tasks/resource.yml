---
# Every object of one resource that the templates name, deleted.

- name: "Index the collection on the target: {{ res.resource }}"
  ansible.builtin.include_role:
    name: ise_common
    tasks_from: ers_collection
  vars:
    ise_common_ers_index_needed: "{{ res.lookup == 'collection' }}"

- name: "Read the collection: {{ res.resource }}"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}"
    # Same tolerance export has: sgt/reservation is 3.5-only and ipsec 404s
    # until a node exists. Neither is a reason to abort a walk.
    status_code: "{{ [200, 400, 404, 500] if res.optional else [200] }}"
  register: ise_destroy_target_coll
  check_mode: false
  when: res.api == 'openapi'

- name: "Find site templates: {{ res.resource }}"
  ansible.builtin.find:
    paths: "{{ site_template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: ise_destroy_found_site
  when:
    - ise_sites | default([]) | length > 0
    - (site_template_dir ~ '/' ~ res.resource) is exists

- name: "Destroy each site object: {{ res.resource }}"
  ansible.builtin.include_tasks: site_object.yml
  loop: >-
    {{ ise_destroy_found_site.files | default([]) | map(attribute='path')
    | sort | list }}
  loop_control:
    loop_var: tmpl
    label: "{{ tmpl | basename }}"

- name: "Find exported templates: {{ res.resource }}"
  ansible.builtin.find:
    paths: "{{ template_dir }}/{{ res.resource }}"
    patterns: "*.json.j2"
    file_type: file
  register: ise_destroy_found
  when:
    - not (ise_site_only | bool)
    - (template_dir ~ '/' ~ res.resource) is exists

- name: "Destroy each exported object: {{ res.resource }}"
  ansible.builtin.include_tasks: object.yml
  loop: >-
    {{ [] if ise_site_only | bool else ise_destroy_found.files | default([])
    | map(attribute='path') | sort | list }}
  loop_control:
    loop_var: tmpl
    label: "{{ tmpl | basename }}"
