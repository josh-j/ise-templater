---
# Export one OpenAPI resource. Unlike ERS the listing already carries whole
# objects, so there is no per-object detail fetch and no pagination to walk.

# `optional` covers endpoints that legitimately are not there: sgt/reservation
# exists on 3.5 and 404s on 3.3, and ipsec answers "IPSec nodes do not exist"
# until one is configured. Neither is an export failure.
# OpenAPI collections page with a silent default of 100. Ask for `size` and
# you get it -- /trustsec/sgacl/nbarapp holds 780 and returned exactly 100
# until this was noticed. Nothing in the response says it was truncated:
# no total, no nextPage, just a short-looking list.
- name: "GET the collection: {{ res.resource }}"
  ansible.builtin.uri:
    url: >-
      {{ ise_api_url }}{{ res.path }}{{ '' if res.singleton else '?size=' ~
      ise_api_page_size }}
    status_code: "{{ [200, 400, 404, 500] if res.optional else [200] }}"
  register: ise_export_api_coll
  check_mode: false

# Only pages past the first if the first came back full. A page beyond the end
# returns an empty list, so trailing pages cost nothing when there is no more.
- name: "Page on if that filled: {{ res.resource }}"
  ansible.builtin.uri:
    url: >-
      {{ ise_api_url }}{{ res.path }}?size={{ ise_api_page_size }}&page={{
      page }}
    status_code: [200]
  register: ise_export_api_more
  check_mode: false
  loop: >-
    {{ range(2, ise_api_max_pages | int + 1) | list
       if (ise_export_api_coll.status == 200
           and not res.singleton
           and (ise_export_api_coll.json.response | default([]) | length) ==
    (ise_api_page_size | int))
       else [] }}
  loop_control:
    loop_var: page
    label: "page {{ page }}"

- name: "Unwrap the response: {{ res.resource }}"
  ansible.builtin.set_fact:
    ise_export_api_objects: >-
      {{ ise_export_api_coll
      | ise_unwrap_collection(res.singleton, res.resource,
      ise_export_api_more.results | default([])) }}

- name: "Warn if it is still truncated: {{ res.resource }}"
  ansible.builtin.debug:
    msg: >-
      {{ res.resource }}: filled every one of {{ ise_api_max_pages }} pages at
      {{ ise_api_page_size }} objects each. Raise ise_api_max_pages -- the
      export is short and nothing in the response would say so.
  when:
    - ise_export_api_more.results is defined
    - ise_export_api_more.results | length > 0
    - >-
        (ise_export_api_more.results | last).json.response | default([])
        | length == (ise_api_page_size | int)

- name: "Write the export: {{ res.resource }}"
  ansible.builtin.copy:
    content: "{{ ise_export_api_objects | to_nice_json }}"
    dest: "{{ export_dir }}/{{ res.resource }}.json"
    mode: "0600"
  when: res.children is not defined

# Policy sets are the only hierarchical case: the rules that make a policy set
# mean anything are separate collections hanging off its id. Each parent and
# its rule lists are kept in one document, because that is the unit a person
# reasons about and the unit that has to be applied together.
- name: "Reset the accumulator: {{ res.resource }}"
  ansible.builtin.set_fact:
    ise_export_aggregate_docs: []
  when: res.children is defined

- name: "Fetch child rules per policy set: {{ res.resource }}"
  ansible.builtin.include_tasks: openapi_children.yml
  loop: "{{ ise_export_api_objects }}"
  loop_control:
    loop_var: parent
    label: "{{ parent.name }}"
  when: res.children is defined

- name: "Write the aggregate export: {{ res.resource }}"
  ansible.builtin.copy:
    content: >-
      {{ ise_export_aggregate_docs | sort(attribute='name') | list
      | to_nice_json }}
    dest: "{{ export_dir }}/{{ res.resource }}.json"
    mode: "0600"
  when: res.children is defined
