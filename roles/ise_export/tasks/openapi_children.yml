---
# One policy set plus its rule collections, assembled into a single document.

- name: "GET each rule collection: {{ parent.name }}"
  ansible.builtin.uri:
    url: "{{ ise_api_url }}{{ res.path }}/{{ parent.id }}/{{ child }}"
    # A policy set with no rules of a given kind answers 404 rather than an
    # empty list, and that is not an error worth stopping an export for.
    status_code: [200, 404]
  register: ise_export_api_children
  check_mode: false
  loop: "{{ res.children }}"
  loop_control:
    loop_var: child
    label: "{{ child }}"

- name: "Assemble the document: {{ parent.name }}"
  ansible.builtin.set_fact:
    ise_export_aggregate_docs: >-
      {{ (ise_export_aggregate_docs | default([])) + [
           {'name': parent.name, 'policySet': parent}
           | combine(dict(res.children | zip(
               ise_export_api_children.results
               | map(attribute='json.response', default=[]) | list)))
         ] }}
