---
# Dispatch one rendered template at whichever API owns it.

- name: Render {{ tmpl | basename }}
  ansible.builtin.set_fact:
    ise_apply_obj: "{{ lookup('template', tmpl) | from_json }}"

- name: Apply via ERS
  ansible.builtin.include_tasks: ers_object.yml
  when: res.api == 'ers'

- name: Apply via OpenAPI
  ansible.builtin.include_tasks: openapi_object.yml
  when:
    - res.api == 'openapi'
    - res.children is not defined

- name: Apply a policy set and its rules
  ansible.builtin.include_tasks: policyset.yml
  when: res.children is defined
