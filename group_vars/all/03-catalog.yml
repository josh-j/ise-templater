---
# The catalog: every resource this project knows how to move, in apply order.
#
# List order is apply order, and it matters -- groups and conditions have to
# exist before the objects that reference them. Export and templatize walk it
# forwards, destroy walks it backwards.
#
# Adding a resource is adding an entry here. Nothing else changes.
#
# Keys, all optional except `resource`:
#
#   resource   the name you type: `./ise export -e resources=sgt`
#   group      which family it belongs to, for the switches in 02-families.yml
#   api        ers (the default) or openapi
#   root       the ERS wrapper key. Not derivable from the path: endpointgroup
#              returns EndPointGroup, activedirectory returns ERSActiveDirectory
#   path       the OpenAPI path. Ignored for ERS resources
#   mode       full (the default) -- export, templatize and apply it
#              config            -- export only, as a record of the appliance
#   detail     false when ERS has no GET-by-id and the listing is all there is
#   name_key   the field holding the object's name, when it is not `name`.
#              May be dotted: `rule.name`
#   strip      extra server-owned fields to drop, on top of ise_strip_keys
#   lookup     how apply finds an existing object on the target
#              name (the default) -- GET .../name/<name>, exact, one request
#              collection         -- read the whole collection once and match
#                                    in memory, for resources with no
#                                    GET-by-name. Do not reach for
#                                    `?filter=name.EQ.` instead: guesttype and
#                                    sponsorgroup accept it, ignore it, and
#                                    return everything
#   singleton  an OpenAPI endpoint returning one object rather than a list
#   optional   tolerate a 4xx/5xx: the resource may not exist on this version
#   children   OpenAPI sub-collections fetched per parent, kept in one document
#   parent_ref an id reference to this resource's own objects
#   refs       id references to other resources
#   templatize_skip  a field/value marking objects not worth templating
#
# None of these are guesswork. Each is here because an appliance behaved that
# way and a run failed until it was declared -- docs/ise-api-notes.md has the
# stories. docs/catalog.md is the same list as prose, if you would rather read
# it that way.
ise_catalog:

  # --- groups and tags: nothing here references anything ---
  - resource: networkdevicegroup
    group: core
    root: NetworkDeviceGroup
  - resource: endpointgroup
    group: core
    root: EndPointGroup
    strip: [systemDefined]      # ISE decides this, and rejects being told
    # Every endpoint group in this deployment is a Cisco built-in, present
    # identically on any appliance -- templating them is noise, and at least
    # one cannot be written back at all: "Blocked List" ships with a space in
    # its name and ISE's own PUT validator rejects names with spaces.
    templatize_skip:
      field: systemDefined
      equals: true
    # 30 of 35 endpoint groups point at a parent by UUID. Templatize swaps it
    # for the parent's name, apply swaps it back against the target's own ids.
    # Without this the templates only port between appliances restored from
    # the same backup.
    parent_ref:
      id_field: parentId
      name_field: parentName
  - resource: identitygroup
    group: core
    root: IdentityGroup
    mode: config                # ERS serves identity groups read-only

  # --- TrustSec ---
  - resource: sgt
    group: trustsec
    root: Sgt
    strip: [generationId]       # bumped by ISE on every write
  - resource: sgacl
    group: trustsec
    root: Sgacl
    strip: [generationId]
    lookup: collection          # sgacl answers 405 to GET .../name/<name>
  - resource: sxpvpns
    group: trustsec
    root: ERSSxpVpn
    name_key: sxpVpnName        # no `name` field at all, and none in the listing
    mode: config                # and so nothing to match an object on: the
                                # collection carries only id and link

  # The egress policy matrix -- the cells that bind an SGT pair to an SGACL.
  # sgt and sgacl above are only the axes; this is the policy. It has to come
  # after both, because a cell is three UUID references and nothing else:
  # sourceSgtId, destinationSgtId and an sgacls list. `refs` rewrites all
  # three to names on the way into a template and back to the target's own
  # ids on the way out -- see ise_swap_refs.
  - resource: egressmatrixcell
    group: trustsec
    root: EgressMatrixCell
    lookup: collection          # cells are named ANY-ANY etc; no GET-by-name
    # ANY-ANY is the matrix catch-all, present on every appliance. GET returns
    # both `defaultRule` and `sgacls`; PUT accepts only one of them, so the
    # object cannot be written back as read: "Only one Catch All Rule SGACL
    # can exsits [None,Permit IP,Deny IP]". Ordinary cells carry
    # defaultRule NONE and a real sgacls list, and template fine.
    templatize_skip:
      field: name
      equals: ANY-ANY
    refs:
      - field: sourceSgtId
        name_field: sourceSgtName
        resource: sgt
      - field: destinationSgtId
        name_field: destinationSgtName
        resource: sgt
      - field: sgacls
        name_field: sgaclNames
        resource: sgacl
        list: true

  # --- TrustSec beyond the SGT/SGACL axes ---
  # Virtual networks, the SGT-to-VN-to-VLAN model, IP-to-SGT mappings, SXP
  # peering and the reserved SGT range. All empty in this lab except nbarapp.
  - resource: trustsec-virtualnetwork
    group: trustsec
    api: openapi
    path: /api/v1/trustsec/virtualnetwork
  - resource: trustsec-nbarapp
    group: trustsec
    api: openapi
    path: /api/v1/trustsec/sgacl/nbarapp
  - resource: sgt-reservation
    group: trustsec
    api: openapi
    path: /api/v1/sgt/reservation
    optional: true              # 3.5 only; 404 on 3.3 P11
  - resource: sgtvnvlan
    group: trustsec
    root: SgtVNVlanContainer
  - resource: sgmapping
    group: trustsec
    root: SGMapping
  - resource: sgmappinggroup
    group: trustsec
    root: SGMappingGroup
  - resource: sxpconnections
    group: trustsec
    root: ERSSxpConnection
  - resource: sxplocalbindings
    group: trustsec
    root: ERSSxpLocalBindings

  # --- profiling and onboarding ---
  - resource: filterpolicy
    group: core
    root: ERSFilterPolicy
  - resource: nspprofile
    group: core
    root: ERSNSPProfile
  - resource: certificatetemplate
    group: core
    root: ERSCertificateTemplate
  - resource: endpoint-custom-attribute
    group: core
    api: openapi
    path: /api/v1/endpoint-custom-attribute
  - resource: dictionaries
    group: core
    api: openapi
    path: /api/v1/policy/network-access/dictionaries

  # --- integrations ---
  - resource: pxgridsettings
    group: integration
    root: PxgridSettings
  - resource: pxgrid-direct-connector
    group: integration
    api: openapi
    path: /api/v1/pxgrid-direct/connector-config
  - resource: acibindings
    group: integration
    root: AciBindings
  - resource: ipsec
    group: integration
    api: openapi
    path: /api/v1/ipsec
    optional: true              # 404 until an IPsec node exists
  - resource: integration-catalog
    group: integration
    api: openapi
    path: /api/v1/integration-catalog/applications
    singleton: true
    mode: config
  - resource: dataconnect-settings
    group: integration
    api: openapi
    path: /api/v1/mnt/data-connect/settings
    singleton: true
    mode: config
  - resource: smsprovider
    group: integration
    root: ERSSmsProvider
    detail: false               # no GET-by-id
    mode: config

  # --- guest ---
  - resource: guestssid
    group: guest
    root: GuestSSID
  - resource: guestsmtpnotificationsettings
    group: guest
    root: ERSGuestSmtpNotificationSettings
    name_key: id                # one settings record, and it has no name field
    mode: config
  - resource: sponsorgroupmember
    group: guest
    root: ERSSponsorGroupMember
    detail: false               # no GET-by-id
    mode: config

  # --- portals: off by default (ise_group_portals) ---
  # Large nested objects with per-node URLs and customisation baked in. They
  # template, but porting one needs a lot of tokens.
  - resource: portal
    group: portals
    root: ERSPortal
    mode: config                # a read-only view of the typed portals below
  - resource: portaltheme
    group: portals
    root: PortalTheme
  - resource: portalglobalsetting
    group: portals
    root: PortalCustomizationGlobalSetting
  - resource: hotspotportal
    group: portals
    root: HotspotPortal
  - resource: selfregportal
    group: portals
    root: SelfRegPortal
  - resource: sponsorportal
    group: portals
    root: SponsorPortal
  - resource: sponsoredguestportal
    group: portals
    root: SponsoredGuestPortal
  - resource: mydeviceportal
    group: portals
    root: MyDevicePortal
  - resource: byodportal
    group: portals
    root: BYODPortal

  # --- runtime and lifecycle: off by default ---
  - resource: endpoint
    group: runtime
    root: ERSEndPoint
    mode: config
  - resource: sessionservicenode
    group: lifecycle
    root: SessionServiceNode
    mode: config
  - resource: deployment-node-group
    group: lifecycle
    api: openapi
    path: /api/v1/deployment/node-group
    mode: config
  - resource: trusted-certificate
    group: lifecycle
    api: openapi
    path: /api/v1/certs/trusted-certificate
    name_key: friendlyName
    mode: config

  # --- the profiles everything else is described in terms of ---
  # How a NAD speaks RADIUS -- CoA type, VLAN/dACL attribute mapping, redirect
  # parameters. Both `networkdevice.profileName` and
  # `authorizationprofile.profileName` name one of these.
  #
  # Both of these resources report `total: 0` while returning every object
  # they hold, and ignore `size`. export_ers.yml always fetches page one for
  # that reason.
  - resource: networkdeviceprofile
    group: core
    root: NetworkDeviceProfile
    mode: config                # read-only over ERS -- see below
  - resource: certificateprofile
    group: core
    root: CertificateProfile
    templatize_skip:            # the only one present ships with ISE
      field: name
      equals: Preloaded_Certificate_Profile

  # --- the condition library, after the groups it is allowed to name ---
  # A condition's attributeValue is validated against the thing it points at:
  # DEVICE:Location = "All Locations#Nowhere" is rejected outright with
  # "Value for attribute is not a permitted option". So a site's location
  # group has to exist before a condition can match on it, and this entry
  # cannot move back above networkdevicegroup and endpointgroup.
  - resource: condition
    group: core
    api: openapi
    path: /api/v1/policy/network-access/condition
  # /api/v1/policy/device-admin/condition is deliberately absent: it returns a
  # filtered view of this same library (7 of these 23 here), not a separate
  # store, so exporting both would duplicate every object.

  # Reusable conditions that are not attribute tests: named lists of devices
  # or device ports, and named time/date windows. Both services keep their
  # own, and both are empty in this lab -- so, like the RADIUS proxy
  # resources, they template but are unproven against real data.
  - resource: network-condition
    group: core
    api: openapi
    path: /api/v1/policy/network-access/network-condition
  - resource: time-condition
    group: core
    api: openapi
    path: /api/v1/policy/network-access/time-condition
  - resource: device-admin-network-condition
    group: deviceadmin
    api: openapi
    path: /api/v1/policy/device-admin/network-condition
  - resource: device-admin-time-condition
    group: deviceadmin
    api: openapi
    path: /api/v1/policy/device-admin/time-condition

  # --- authentication and authorization building blocks ---
  - resource: allowedprotocols
    group: core
    root: AllowedProtocols
  - resource: idstoresequence
    group: identity
    root: IdStoreSequence
  - resource: downloadableacl
    group: core
    root: DownloadableAcl
  - resource: authorizationprofile
    group: core
    root: AuthorizationProfile

  # --- external identity and RADIUS/TACACS proxying ---
  # All empty in this lab, which is exactly why they were missed on the first
  # pass: an empty collection looks identical to an absent one unless you go
  # looking. Their wrapper keys come from Cisco's own SDK model names rather
  # than from a live object, and are unverified against real data here.
  - resource: ldap
    group: identity
    root: ERSLdap
  - resource: restidstore
    group: identity
    root: ERSRestIDStore
  - resource: externalradiusserver
    group: identity
    root: ExternalRadiusServer
  - resource: radiusserversequence
    group: identity
    root: RadiusServerSequence
  - resource: tacacsexternalservers
    group: identity
    root: TacacsExternalServer
  - resource: tacacsserversequence
    group: identity
    root: TacacsServerSequence

  # --- device admin (TACACS+) ---
  - resource: tacacsprofile
    group: deviceadmin
    root: TacacsProfile
  - resource: tacacscommandsets
    group: deviceadmin
    root: TacacsCommandSets

  # --- Adaptive Network Control ---
  # ancpolicy is configuration. ancendpoint is a live quarantine assignment --
  # runtime state, so captured rather than applied.
  - resource: ancpolicy
    group: integration
    root: ErsAncPolicy
  - resource: ancendpoint
    group: integration
    root: ErsAncEndpoint
    mode: config

  # --- guest ---
  - resource: guesttype
    group: guest
    root: GuestType
    lookup: collection
  - resource: guestlocation
    group: guest
    root: GuestLocation
    detail: false               # no GET-by-id; the listing is the whole object
    lookup: collection
  - resource: sponsorgroup
    group: guest
    root: SponsorGroup
    lookup: collection

  # --- profiling ---
  - resource: profilerprofile
    group: core
    root: ProfilerProfile
    lookup: collection

  # --- network devices, last: they reference the groups above ---
  - resource: networkdevice
    group: core
    root: NetworkDevice

  # --- policy sets, with their rules in the same document ---
  - resource: policy-set
    group: core
    api: openapi
    path: /api/v1/policy/network-access/policy-set
    children: [authentication, authorization, exception]
    strip: [hitCounts]          # runtime counters. `rank` is kept: rule order
                                # is a decision an admin made, not server state
  - resource: device-admin-policy-set
    group: deviceadmin
    api: openapi
    path: /api/v1/policy/device-admin/policy-set
    children: [authentication, authorization, exception]
    strip: [hitCounts]

  # Global exceptions are evaluated ahead of every policy set, so they come
  # last to apply -- after the profiles and conditions they name exist. Unlike
  # a policy set these are a bare rule list at a fixed path, and a rule keeps
  # its name one level down, hence the dotted name_key.
  - resource: global-exception
    group: core
    api: openapi
    path: /api/v1/policy/network-access/policy-set/global-exception
    name_key: rule.name
    strip: [hitCounts]
  - resource: device-admin-global-exception
    group: deviceadmin
    api: openapi
    path: /api/v1/policy/device-admin/policy-set/global-exception
    name_key: rule.name
    strip: [hitCounts]

  # --- captured, never applied ---------------------------------------------
  # These export so you have a record of the appliance, but they are not
  # templated and not written anywhere. Each for its own reason.
  - resource: internaluser
    group: identity
    root: InternalUser
    mode: config                # password state cannot round-trip an export
  - resource: adminuser
    group: identity
    root: AdminUser
    mode: config                # same, and these are admin credentials
  - resource: activedirectory
    group: identity
    root: ERSActiveDirectory
    mode: config                # a join point is an operation, not a document
  - resource: node
    group: lifecycle
    root: Node
    mode: config                # deployment membership, not portable config
  - resource: repository
    group: lifecycle
    api: openapi
    path: /api/v1/repository
    name_key: name
    mode: config                # carries backup-target credentials

  # networkdeviceprofile is up in the profiles block, and is `mode: config`
  # because ERS does not support writing it. Cisco's own ciscoisesdk, which is
  # generated from ISE's API definitions, has no network_device_profile module
  # in any version from 3.1.0 to 3.5.0 -- while certificate_profile is there
  # with a create method, exactly matching what this lab does and does not
  # accept. The endpoint parses a POST and argues about fields, which makes it
  # look supported; it never completes one. See docs/ise-api-notes.md.
  - resource: system-settings-proxy
    group: lifecycle
    api: openapi
    path: /api/v1/system-settings/proxy
    singleton: true
    mode: config

# Reference kinds the preflight reports but will not fail on. Empty: every
# kind a policy set can name now has an authoritative endpoint to check it
# against. `identitySourceName` was the last holdout -- it can legally be an
# internal store, an AD join point or a sequence, and no ERS resource answers
# for all three, but /api/v1/policy/network-access/identity-stores lists
# exactly that union and preflight uses it.

preflight_advisory: []
