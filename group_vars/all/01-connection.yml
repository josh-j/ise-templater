---
# How to reach ISE, and who to log in as.
#
# group_vars/all/ applies to every host in inventory.yml. Ansible reads every
# file in this directory, in name order, and the numbering is only there to
# say what to read first.

# --- how Ansible runs ------------------------------------------------------
# There is no SSH anywhere in this project. Every task is an HTTPS call made
# from this machine, so Ansible "connects" to localhost and `ansible_host` is
# used for nothing but building the URL.
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# --- the two APIs ----------------------------------------------------------
# ISE serves configuration on two of them, and this project needs both.
# ERS is the older one, on port 9060. OpenAPI is on 443 and is where anything
# added since roughly ISE 2.6 lives, policy sets included.
ise_ers_port: 9060
ise_ers_url: "https://{{ ansible_host }}:{{ ise_ers_port }}/ers"
ise_api_url: "https://{{ ansible_host }}"

ise_validate_certs: false     # lab appliances present self-signed certificates
ise_timeout: 60

# Page sizes. ERS caps a page at 100 whatever you ask for. OpenAPI defaults to
# 100, honours a larger `size`, and rejects 5000 outright -- 500 is comfortably
# inside that and keeps most collections to a single request.
ise_page_size: 100
ise_api_page_size: 500
ise_api_max_pages: 20

# --- who to log in as ------------------------------------------------------
# This is the GUI password, which on ISE is a different credential from the
# CLI/SSH one. Put it in credentials.yml -- copy credentials.example.yml and
# fill it in, or run `./ise setup`, which does the copying for you.
#
# Where the password is looked for, first hit wins:
#
#   1. -e ise_password=... on the command line
#   2. credentials.yml
#   3. ISE_PASSWORD in the environment
#   4. a sops store, and only with -e ise_password_sops=true
#
# The first two are not written below because they do not need to be. Both
# outrank this file, so a value from either simply replaces what is set here.
ise_user: admin

ise_credentials_file: "{{ playbook_dir }}/credentials.yml"

# sops is a separately installed Go binary and the store below belongs to one
# particular machine, so this stays off unless asked for.
ise_password_sops: false
sops_file: /srv/nix-config/secrets/common.yaml
sops_key: lab_ise_ui_admin_pw
sops_cmd: "sops -d --extract '[\"{{ sops_key }}\"]' {{ sops_file }}"

# The if/else is deliberate, and is not the same as `| default(x, true)`:
# Jinja evaluates filter arguments eagerly, so the `default` form ran sops on
# every task even when ISE_PASSWORD was already set -- hundreds of times in a
# full run. An if/else only evaluates the branch it takes.
ise_password: >-
  {{ lookup('env', 'ISE_PASSWORD') if lookup('env', 'ISE_PASSWORD')
     else (lookup('pipe', sops_cmd) if ise_password_sops | bool else '') }}
