---
# Render templates/ and push them at the target appliance. Creates what is
# missing, updates what already exists, matching on object name.
#
#   ansible-playbook apply.yml -e ise_dry_run=true      # show, do not write
#   ansible-playbook apply.yml
#   ansible-playbook apply.yml -e resources=networkdevicegroup

- name: Apply templates to ISE
  hosts: ise_target
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      user: "{{ ise_user }}"
      password: "{{ ise_password }}"
      force_basic_auth: true
      validate_certs: "{{ ise_validate_certs }}"
      timeout: "{{ ise_timeout }}"
      headers:
        Accept: application/json
  vars:
    template_dir: "{{ playbook_dir }}/templates"
    # Templates rendered once per entry in `ise_sites` rather than once each.
    # Empty unless a sites file is loaded, so this costs nothing by default.
    site_template_dir: "{{ playbook_dir }}/site-templates"
    # Print what would happen and write nothing.
    ise_dry_run: false
    # Push only the site fan-out, leaving the exported templates alone. Useful
    # when you want to add sites to an appliance without also rewriting the
    # objects the export happened to capture.
    ise_site_only: false

  pre_tasks:
    - name: Check credentials
      ansible.builtin.import_tasks: tasks/check_password.yml

  tasks:
    - name: Resolve which resources to apply
      ansible.builtin.set_fact:
        selected: >-
          {{ ((ise_catalog | ise_enabled_groups(ise_groups_enabled))
              if (resources | default('') | trim) == ''
              else ise_catalog | selectattr('resource', 'in',
                                            resources.split(',') | map('trim') | list) | list)
             | ise_exclude_config }}

    - name: Announce the target
      ansible.builtin.debug:
        msg: >-
          {{ 'DRY RUN -- ' if ise_dry_run | bool else '' }}applying
          {{ selected | map(attribute='resource') | join(', ') }}
          to {{ inventory_hostname }} ({{ ansible_host }})

    - name: Apply each resource in catalog order
      ansible.builtin.include_tasks: tasks/apply_resource.yml
      loop: "{{ selected }}"
      loop_control:
        loop_var: res
        label: "{{ res.resource }}"
