---
# Copy this to credentials.yml and fill it in. credentials.yml is gitignored;
# this file is the committed example and must never hold a real secret.
#
#   cp credentials.example.yml credentials.yml
#   $EDITOR credentials.yml
#
# Every playbook loads credentials.yml if it is there and ignores it if it is
# not, so nothing here is required -- ISE_PASSWORD in the environment still
# works exactly as before. What this file buys you is not re-exporting a
# variable in every new shell.
#
# Precedence, first hit wins:
#
#   1. -e on the command line
#   2. credentials.yml
#   3. ISE_PASSWORD in the environment
#   4. the sops store, and only with -e ise_password_sops=true

# --- the admin account -----------------------------------------------------
# This is the GUI/ERS/OpenAPI password, which on ISE is a separate credential
# from the CLI/SSH one. The account needs the ERS Admin and, for the OpenAPI
# resources, the Super Admin or equivalent role.

ise_user: admin
ise_password: "change-me"

# --- optional --------------------------------------------------------------

# Lab appliances present self-signed certificates, so verification is off by
# default. Turn it on once the target has a certificate you trust.
# ise_validate_certs: false

# What the templating tokens resolve to at apply time. The defaults in
# group_vars/all/04-templating.yml reproduce the source lab exactly; override
# them here to push your own RADIUS shared secrets instead of the exported ones.
# site_radius_secret_sim: "..."
# site_radius_secret_lab: "..."
# site_radius_secret_cml: "..."

# --- different credentials per appliance -----------------------------------
# This file applies to every host. When the source and target want different
# accounts, put the pair in host_vars/<inventory_hostname>.yml instead --
# host_vars beats this file:
#
#   host_vars/laba-ise-004.yml
#     ise_user: apiadmin
#     ise_password: "..."

# --- keeping it encrypted --------------------------------------------------
# credentials.yml may be an ansible-vault file rather than cleartext, and the
# playbooks read it either way:
#
#   ansible-vault encrypt credentials.yml
#   ./ise export                       # prompts for the vault password
#
# Put the vault password in .vault-pass (also gitignored) and ./ise picks it
# up without prompting.
